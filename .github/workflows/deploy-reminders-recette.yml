name: Déployer les rappels — recette Cloudflare
# Mise à jour du code sans écraser les secrets déjà configurés dans Cloudflare.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gros-petard-rappels-recette
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: rappels-recette
    defaults:
      run:
        working-directory: cloudflare/reminders
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAPPELS_KV_NAMESPACE_ID: ${{ secrets.RAPPELS_KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f0465f4cd6ca6bf8cedb16b5d0a0c589efefd309
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/reminders/package-lock.json
      - name: Vérifier les paramètres requis
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RAPPELS_KV_NAMESPACE_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Secret GitHub manquant : $key"
              exit 1
            fi
          done
          [[ "$RAPPELS_KV_NAMESPACE_ID" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "::error::Identifiant KV invalide"; exit 1; }
      - run: npm ci
      - run: npm test
      - name: Préparer la configuration de recette isolée
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = fs.readFileSync('wrangler.toml','utf8');
          fs.writeFileSync('wrangler.recette.local.toml', base.replace('00000000000000000000000000000000', process.env.RAPPELS_KV_NAMESPACE_ID), {mode:0o600});
          NODE
      - name: Déployer le Worker de recette et le déclencheur minute
        run: npx wrangler deploy --config wrangler.recette.local.toml --keep-vars
      - name: Nettoyer les fichiers temporaires
        if: always()
        run: rm -f wrangler.recette.local.toml
